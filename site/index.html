<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S3 + CloudFront App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Hello from S3 + CloudFront</h1>
    <p>This page is stored in a private S3 bucket and served over HTTPS by CloudFront. You're only seeing it because you signed in with Cognito.</p>
    <button id="counter" type="button">Clicked 0 times</button>
    <p class="meta">Loaded at <span id="loaded"></span> · <a href="/logout">Sign out</a></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
